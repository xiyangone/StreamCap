[package]
name = "streamcap-desktop"
version = "0.1.0"
edition = "2021"
description = "StreamCap desktop frontend (Leptos CSR)"
exclude = ["src-tauri", "core"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.6"
gloo-timers = "0.3"
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.128"
futures = "0.3.34"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = ["EventSource", "MessageEvent", "HtmlVideoElement", "Url", "Navigator", "Clipboard", "Window", "Document", "Storage", "HtmlDialogElement", "HtmlElement", "Element", "Node", "KeyboardEvent", "MouseEvent", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlMediaElement", "MediaQueryList", "Location", "Event", "EventTarget", "AbortController", "AbortSignal", "DomRect"] }

[profile.release]
opt-level = "z"
lto = true
