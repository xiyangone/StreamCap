[package]
name = "streamcap-core"
version = "0.1.0"
edition = "2021"
description = "StreamCap Rust 后端核心：配置、任务、调度、录制引擎、HTTP API"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "gzip", "brotli", "socks"] }
base64 = "0.22"
regex = "1"
sm3 = "0.4"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["rt", "io"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
anyhow = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

windows = { version = "0.61.3", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }
windows-core = "0.61"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3"
