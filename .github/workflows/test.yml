name: Native validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/build/playwright
  STREAMCAP_CACHE_PATHS: |
    ~/.cargo/registry
    ~/.cargo/git
    desktop/target
    desktop/core/target
    desktop/src-tauri/target
    desktop/build/npm-cache
    desktop/build/playwright
    desktop/build/ffmpeg-bundle
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: "24"
    - uses: actions/cache/restore@v6.1.0
      id: cache
      with:
        path: ${{ env.STREAMCAP_CACHE_PATHS }}
        key: native-${{ runner.os }}-rust195-${{ hashFiles('desktop/**/Cargo.lock', 'desktop/package-lock.json', 'desktop/ffmpeg-bundle.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          native-${{ runner.os }}-rust195-${{ hashFiles('desktop/**/Cargo.lock', 'desktop/package-lock.json', 'desktop/ffmpeg-bundle.json') }}-
          native-${{ runner.os }}-rust195-
    - name: Install Rust toolchain and project tools
      id: toolchain
      shell: pwsh
      working-directory: desktop
      run: |
        $ErrorActionPreference = "Stop"
        rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        rustup default 1.95.0
        cargo install trunk --version 0.21.14 --locked --root target/tools
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        cargo install wasm-bindgen-cli --version 0.2.129 --locked --root target/tools
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        cargo install cargo-audit --version 0.22.2 --locked --root target/tools
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Restore locked dependencies
      id: dependencies
      shell: pwsh
      working-directory: desktop
      run: |
        npm ci --cache build/npm-cache
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        npx playwright install chromium
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        foreach ($manifest in @("Cargo.toml", "core/Cargo.toml", "src-tauri/Cargo.toml")) {
          cargo fetch --manifest-path $manifest --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
    - name: Full native verification and bundled FFmpeg build
      id: verify
      shell: pwsh
      working-directory: desktop
      run: npm run verify
    - name: Upload verification evidence
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: native-verification
        path: |
          desktop/tests/artifacts/**/verification.json
          desktop/tests/artifacts/**/result.json
          desktop/tests/artifacts/**/ui-result.json
          desktop/tests/artifacts/**/*audit*.json
          desktop/tests/artifacts/**/*.log
          desktop/tests/artifacts/**/*.png
        retention-days: 14
        if-no-files-found: warn
    - name: Preserve prepared build cache
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependencies.outcome == 'success' }}
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ env.STREAMCAP_CACHE_PATHS }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Upload verified executable
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: StreamCap-windows-x64-withFF
        path: |
          ${{ steps.verify.outputs.release-directory }}/StreamCap.exe
          ${{ steps.verify.outputs.release-directory }}/StreamCap.exe.sha256
        if-no-files-found: error
