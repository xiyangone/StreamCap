name: "Native bug report"
description: "Windows x64 Rust/Tauri edition"
body:
  - type: input
    id: version
    attributes:
      label: "App version or build commit"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: "Windows version"
      options: ["Windows 10 x64", "Windows 11 x64"]
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: "How was the app launched?"
      options: ["noFF EXE", "Tauri development build"]
  - type: textarea
    id: description
    attributes:
      label: "Description and reproduction"
      description: "Include expected and actual behavior. Never post cookies, tokens or account credentials."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Relevant environment and sanitized logs"
      description: "WebView2/FFmpeg versions; for source builds include Rust, Node and Trunk versions."
