name: "原生版问题反馈"
description: "Windows x64 Rust/Tauri 原生版"
body:
  - type: input
    id: version
    attributes:
      label: "程序版本或构建提交"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: "Windows 版本"
      options: ["Windows 10 x64", "Windows 11 x64"]
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: "启动方式"
      options: ["noFF EXE", "Tauri development build"]
  - type: textarea
    id: description
    attributes:
      label: "问题描述和复现步骤"
      description: "请描述预期与实际行为，不要提交 Cookie、Token 或账号凭证。"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "相关环境与脱敏日志"
      description: "WebView2、FFmpeg 版本；源码构建请附 Rust、Node、Trunk 版本。"
