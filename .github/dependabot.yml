version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
  - package-ecosystem: "cargo"
    directory: "/desktop/core"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
